<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Input Nama</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1 class="judul">Form Input Nama</h1>

        <div class="kartu">
            <form method="POST" action="/kirim">
                <label for="nama">Masukkan Nama:</label>
                <input type="text" id="nama" name="nama" placeholder="Nama kamu..." required>
                <div class="btn-wrapper">
                    <button type="submit">Kirim</button>
                </div>
            </form>
        </div>

        {% if nama %}
        <div class="kartu hasil">
            <h2>Data Berhasil Dikirim!</h2>
            <p class="sapaan">Halo, {{ nama }}!</p>
            <p class="sub-teks">Selamat datang di aplikasi Flask.</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
